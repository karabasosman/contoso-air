---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contoso-air-config
  namespace: contoso-air
  labels:
    app: contoso-air-web
    component: config
    environment: production
data:
  # Application configuration
  log-level: "info"
  session-timeout: "3600"
  max-connections: "100"
  cache-ttl: "300"
  
  # Database configuration
  db-pool-size: "10"
  db-timeout: "5000"

  # Monitoring configuration
  metrics-enabled: "true"
  health-check-interval: "30"

  # Performance tuning
  node-options: "--max-old-space-size=512"
  cluster-workers: "1"

