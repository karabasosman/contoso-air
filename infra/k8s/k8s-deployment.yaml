---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-air-web
  labels:
    app: contoso-air-web
    app.kubernetes.io/name: contoso-air-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: contoso-air
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Contoso Air web application deployment"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-air-web
      app.kubernetes.io/name: contoso-air-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: contoso-air-web
        app.kubernetes.io/name: contoso-air-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: contoso-air
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contoso-air-web
          image: osktestcrqpjmtpx4xyv3e.azurecr.io/pluxee-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: contoso-air-web-config
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
