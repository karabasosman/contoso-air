---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contoso-air-web-ingress
  namespace: contoso-air
  labels:
    app: contoso-air-web
    component: ingress
    environment: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # Enable external-dns for automatic DNS management
    external-dns.alpha.kubernetes.io/hostname: "contoso-air.example.com"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
spec:
  tls:
  - hosts:
    - contoso-air.example.com
    secretName: contoso-air-tls-cert
  rules:
  - host: contoso-air.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: contoso-air-web
            port:
              number: 80
