---
apiVersion: v1
kind: Namespace
metadata:
  name: contoso-air
  labels:
    name: contoso-air
    environment: production
    project: contoso-air
  annotations:
    kubernetes.io/managed-by: "kubectl"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: contoso-air-quota
  namespace: contoso-air
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "5"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: contoso-air-limits
  namespace: contoso-air
spec:
  limits:
  - default:
      cpu: "1"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2"
      memory: "1Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
