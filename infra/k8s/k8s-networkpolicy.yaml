apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contoso-air-web-netpol
  labels:
    app: contoso-air-web
    app.kubernetes.io/name: contoso-air-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: contoso-air
  annotations:
    description: "Network policy for Contoso Air web application"
spec:
  podSelector:
    matchLabels:
      app: contoso-air-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow external traffic (API calls, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Allow MongoDB/CosmosDB access
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 10255
