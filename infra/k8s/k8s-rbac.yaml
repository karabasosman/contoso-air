---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: contoso-air-web-sa
  namespace: contoso-air
  labels:
    app: contoso-air-web
    component: serviceaccount
    environment: production
  annotations:
    azure.workload.identity/client-id: "AZURE_CLIENT_ID_PLACEHOLDER"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: contoso-air
  name: contoso-air-web-role
  labels:
    app: contoso-air-web
    component: rbac
    environment: production
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contoso-air-web-rolebinding
  namespace: contoso-air
  labels:
    app: contoso-air-web
    component: rbac
    environment: production
subjects:
- kind: ServiceAccount
  name: contoso-air-web-sa
  namespace: contoso-air
roleRef:
  kind: Role
  name: contoso-air-web-role
  apiGroup: rbac.authorization.k8s.io
