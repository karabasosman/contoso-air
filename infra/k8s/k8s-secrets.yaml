---
apiVersion: v1
kind: Secret
metadata:
  name: contoso-air-secrets
  namespace: contoso-air
  labels:
    app: contoso-air-web
    component: secrets
    environment: production
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Use: echo -n "your-secret-value" | base64
  session-secret: Y2hhbmdlLW1lLXRvLWEtc2VjdXJlLXNlY3JldA== # change-me-to-a-secure-secret
  jwt-secret: Y2hhbmdlLW1lLXRvLWEtand0LXNlY3JldA== # change-me-to-a-jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: contoso-air
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://your-keyvault.vault.azure.net/"
      serviceAccountRef:
        name: contoso-air-web-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: contoso-air-external-secrets
  namespace: contoso-air
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: contoso-air-keyvault-secrets
    creationPolicy: Owner
  data:
  - secretKey: cosmos-connection-string
    remoteRef:
      key: cosmos-connection-string
  - secretKey: session-secret
    remoteRef:
      key: session-secret
