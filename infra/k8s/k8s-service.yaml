apiVersion: v1
kind: Service
metadata:
  name: contoso-air-web
  labels:
    app: contoso-air-web
    app.kubernetes.io/name: contoso-air-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: contoso-air
  annotations:
    description: "Contoso Air web application service"
spec:
  type: ClusterIP
  selector:
    app: contoso-air-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  sessionAffinity: None