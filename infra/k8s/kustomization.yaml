---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: contoso-air-production
  annotations:
    config.kubernetes.io/local-config: "true"

# Namespace for all resources
namespace: contoso-air

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: contoso-air
  app.kubernetes.io/instance: contoso-air-prod
  app.kubernetes.io/version: v1.0.0
  app.kubernetes.io/component: web-application
  app.kubernetes.io/part-of: contoso-air
  app.kubernetes.io/managed-by: kustomize

# Resources to include
resources:
  - k8s-namespace.yaml
  - k8s-rbac.yaml
  - k8s-secrets.yaml
  - k8s-configmap.yaml
  - k8s-deployment.yaml
  - k8s-service.yaml
  - k8s-hpa.yaml
  - k8s-pdb.yaml
  - k8s-networkpolicy.yaml
  - k8s-ingress.yaml
  - k8s-monitoring.yaml

# Image transformations
images:
  - name: osktestcrqpjmtpx4xyv3e.azurecr.io/pluxee-demo
    newTag: latest

# Configuration patches
patchesStrategicMerge: []

# JSON patches for specific modifications
patches: []

# Replica count can be overridden per environment
replicas:
  - name: contoso-air-web
    count: 3

# Configure generators for ConfigMaps and Secrets
configMapGenerator: []
secretGenerator: []

# Resource ordering
crds: []
